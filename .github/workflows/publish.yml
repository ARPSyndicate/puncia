name: publish

on:
  release:
    types: [published]
  workflow_dispatch:  # manual fallback, e.g. to retry a failed publish

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A GitHub Environment named "pypi" is required by PyPI's trusted-publisher
    # config below. Adding required reviewers to that environment (Settings ->
    # Environments -> pypi -> Protection rules) turns this into a manual
    # approval gate even after a release is published, if you want one.
    environment:
      name: pypi
      url: https://pypi.org/project/puncia/
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC); no token/secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      - name: Mint a PyPI API token via OIDC
        id: mint
        run: |
          set -euo pipefail
          resp="$(curl -sS -f -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi")"
          oidc_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$resp")"

          mint_resp="$(curl -sS -f -X POST https://pypi.org/_/oidc/mint-token \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"token": sys.argv[1]}))' "$oidc_token")")"
          api_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$mint_resp")"

          # Masks the token in all subsequent log output, then exposes it to
          # later steps via $PYPI_API_TOKEN without ever writing it to disk.
          echo "::add-mask::${api_token}"
          echo "token=${api_token}" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip twine
          twine upload -u __token__ -p "${PYPI_API_TOKEN}" dist/*
